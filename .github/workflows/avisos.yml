name: Avisos de la agenda

# Lo pone en marcha cada día a las 6:30 a. m. (hora de Colombia) el reloj de Cloudflare
# "avisos-agenda", que es puntual. El horario propio de GitHub se quitó porque llegaba con horas de retraso.
on:
  workflow_dispatch:
    inputs:
      ensayo:
        description: "Ensayo: muestra los avisos sin enviarlos"
        type: boolean
        default: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enviar los avisos del día
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          DRY_RUN: ${{ inputs.ensayo && '1' || '0' }}
        run: node scripts/avisos.mjs
